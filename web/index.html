<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181c" />
    <meta name="description" content="ブラウザで遊べる囲碁対局。オンライン対人戦、AI との対局、AI 同士の観戦。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23dcae5f'/%3E%3Cpath d='M20 8v48M44 8v48M8 20h48M8 44h48' stroke='%233a2a12' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='10' fill='%23111'/%3E%3Ccircle cx='44' cy='44' r='10' fill='%23f6f3ec' stroke='%23999'/%3E%3C/svg%3E"
    />
    <title>囲碁対局</title>
    <script>
      // 描画前にテーマを決め、切り替え時のちらつきを防ぐ。
      try {
        const theme = localStorage.getItem('igo.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
