# KataGo の GTP 設定。本アプリのルールに合わせてある。
# 各項目の意味は公式の設定例を参照:
#   https://github.com/lightvector/KataGo/blob/v1.18.1/cpp/configs/gtp_example.cfg
#   https://lightvector.github.io/KataGo/rules.html

# ---- ログ ----
# 標準エラー出力(コンテナのログ)に出す。ファイルには書かない。
logToStderr = true
logAllGTPCommunication = false
logSearchInfo = false

# ---- ルール ----
# "rules = ..." のプリセットは使わず、個別に指定する
# (tromp-taylor は複数子の自殺手を許すので、そのままでは本アプリと合わない)。
koRule = POSITIONAL             # ポジショナル・スーパーコウ
scoringRule = AREA              # 面積計算
taxRule = NONE                  # 囲んだ空点はすべて数える
multiStoneSuicideLegal = false  # 自殺手は不許可(1 子の自殺手は常に不許可)
hasButton = false
whiteHandicapBonus = 0
# 死石を取り切る前にパスしてよいルールか → いいえ。
# 本アプリは終局時に死石を判定せず、盤上の石をすべて生き石として数えるため、
# KataGo にも死石を取り切ってからパスさせる。
friendlyPassOk = false
# コミは対局ごとに GTP の komi コマンドで指定する(ignoreGTPAndForceKomi は使わない)。

# ---- パス ----
# 本アプリは連続パスで即終局し、そのままの盤面を面積計算する(Tromp-Taylor と同じ)。
# そのため「自分のパスで終局して勝ち」という判断をそのまま信じてよい。
conservativePass = false

# ---- 投了 ----
allowResignation = true
resignThreshold = -0.95
resignConsecTurns = 5
# 序盤は投了しない(盤の広さに対する手数の割合)。
resignMinMovesPerBoardArea = 0.25

# ---- 思考量 ----
# CPU 版(Eigen)は重いので、思考量を絞る。9 路盤で 1 手数秒程度。
# 実際の値は katago-gtp(起動スクリプト)が環境変数から上書きする。
maxVisits = 400
maxTime = 3.0
ponderingEnabled = false
numSearchThreads = 4

# 手番ごとの時間管理(持ち時間)は使わないので、遅延の見込みは 0 にする。
lagBuffer = 0.0
