[package]
name = "server"
description = "囲碁対戦サーバー。REST と WebSocket、対局管理、DB への永続化、GTP クライアント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
go-core = { path = "../go-core" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
go-engine = { path = "../go-engine" }
tokio-tungstenite = "0.30.0"
